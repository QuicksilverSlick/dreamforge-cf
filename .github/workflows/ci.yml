name: CI

# CI is a pure pre-merge gate. It runs on PR open/update/synchronize and
# evaluates the merge commit (GitHub's default `pull_request` event behavior).
# Once a PR is merged, branch protection guarantees its CI passed against the
# exact code that becomes main — re-running on the push-to-main event would
# duplicate that work. The post-merge action is `deploy.yml`, not this.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Compute cache key
        id: cache-key
        run: echo "value=bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'bun.lockb') }}" >> "$GITHUB_OUTPUT"

      - name: Restore bun cache
        id: bun-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ steps.cache-key.outputs.value }}

      - name: Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

  typecheck:
    name: Typecheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ needs.install.outputs.cache-key }}

      - name: Install if cache miss
        run: bun install --frozen-lockfile

      - name: Run tsc -b
        run: ./node_modules/.bin/tsc -b

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ needs.install.outputs.cache-key }}

      - name: Install if cache miss
        run: bun install --frozen-lockfile

      - name: Run ESLint (hard gate — clean as of PR 13)
        run: ./node_modules/.bin/eslint .

  build:
    name: Build
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ needs.install.outputs.cache-key }}

      - name: Install if cache miss
        run: bun install --frozen-lockfile

      - name: Build frontend + worker bundle
        run: bun run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  config-validation:
    name: Validate wrangler config
    needs: install
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      # wrangler 4.90+ requires Node.js >= 22 when invoked as a CLI.
      # The GHA ubuntu-latest runner ships Node 20 by default, and
      # `./node_modules/.bin/wrangler` uses the system Node via shebang.
      # Vite-mediated wrangler calls go through bun and are unaffected.
      - name: Setup Node 22 (required by wrangler 4.90+ CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore bun cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ needs.install.outputs.cache-key }}

      - name: Install if cache miss
        run: bun install --frozen-lockfile

      - name: Validate wrangler.jsonc via wrangler types
        # We deliberately skip `wrangler deploy --dry-run` here. This project
        # bundles its worker via @cloudflare/vite-plugin (see vite.config.ts), so
        # wrangler's built-in esbuild can't resolve the vite-only path aliases
        # (worker/*, shared/*). The Build job above is the real bundle gate —
        # it exercises the same path production deploys use.
        # `wrangler types` exercises wrangler.jsonc parsing, binding references,
        # and DO migration consistency without bundling.
        run: ./node_modules/.bin/wrangler types --include-runtime false

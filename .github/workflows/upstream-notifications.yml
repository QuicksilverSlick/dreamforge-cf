name: Upstream Change Notifications

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    name: Check for upstream changes
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/cloudflare/vibesdk.git || true
          git remote set-url upstream https://github.com/cloudflare/vibesdk.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Check for new commits
        id: check
        run: |
          # Get commits that are in upstream but not in our main
          UPSTREAM_COMMITS=$(git log --oneline main..upstream/main --no-merges)

          if [ -z "$UPSTREAM_COMMITS" ]; then
            echo "No new upstream commits"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Found new upstream commits"
            echo "has_changes=true" >> $GITHUB_OUTPUT

            # Count commits
            COMMIT_COUNT=$(echo "$UPSTREAM_COMMITS" | wc -l)
            echo "commit_count=$COMMIT_COUNT" >> $GITHUB_OUTPUT

            # Get latest commit hash
            LATEST_COMMIT=$(git rev-parse upstream/main)
            echo "latest_commit=$LATEST_COMMIT" >> $GITHUB_OUTPUT

            # Save commit details to file
            echo "$UPSTREAM_COMMITS" > /tmp/commits.txt

            # Get detailed commit information
            git log main..upstream/main --no-merges --pretty=format:"- **%h** - %s (%an, %ar)" > /tmp/commits_detailed.txt
          fi

      - name: Create GitHub Issue
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.ISSUE_TOKEN }}
        run: |
          COMMIT_COUNT="${{ steps.check.outputs.commit_count }}"
          LATEST_COMMIT="${{ steps.check.outputs.latest_commit }}"
          COMMITS_DETAILED=$(cat /tmp/commits_detailed.txt)
          CURRENT_COMMIT=$(git rev-parse main)
          COMPARE_URL="https://github.com/cloudflare/vibesdk/compare/${CURRENT_COMMIT}...${LATEST_COMMIT}"

          # Build issue body using printf (use -- to prevent option interpretation)
          printf -- "## 🔔 New Upstream Changes Detected\n\n" > /tmp/issue_body.md
          printf -- "**%s new commit(s)** found in [cloudflare/vibesdk](https://github.com/cloudflare/vibesdk)\n\n" "$COMMIT_COUNT" >> /tmp/issue_body.md
          printf -- "### Latest Upstream Commit\n\`%s\`\n\n" "$LATEST_COMMIT" >> /tmp/issue_body.md
          printf -- "### New Commits\n\n%s\n\n" "$COMMITS_DETAILED" >> /tmp/issue_body.md
          printf -- "### What to Do Next\n\n" >> /tmp/issue_body.md
          printf -- "1. **Review the commits** above to identify relevant changes\n" >> /tmp/issue_body.md
          printf -- "2. **Check for conflicts** with Dreamforge branding\n" >> /tmp/issue_body.md
          printf -- "3. **Selectively sync** changes that benefit Dreamforge\n" >> /tmp/issue_body.md
          printf -- "4. **Preserve our customizations** (branding, logos, configs)\n\n" >> /tmp/issue_body.md
          printf -- "### Compare Changes\n\n" >> /tmp/issue_body.md
          printf -- "View full diff: [Compare on GitHub](%s)\n\n" "$COMPARE_URL" >> /tmp/issue_body.md
          printf -- "---\n\n" >> /tmp/issue_body.md
          printf -- "*This issue was automatically created by the upstream notifications workflow.*\n" >> /tmp/issue_body.md
          printf -- "*Close this issue after reviewing and syncing the relevant changes.*\n" >> /tmp/issue_body.md

          # Create the issue
          gh issue create \
            --title "🔔 Upstream Updates Available ($COMMIT_COUNT new commits)" \
            --body-file /tmp/issue_body.md \
            --label "upstream-notification" || \
          gh issue create \
            --title "🔔 Upstream Updates Available ($COMMIT_COUNT new commits)" \
            --body-file /tmp/issue_body.md

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.has_changes }}" = "true" ]; then
            echo "✅ Created notification issue for ${{ steps.check.outputs.commit_count }} new upstream commits"
          else
            echo "✅ No new upstream changes detected"
          fi

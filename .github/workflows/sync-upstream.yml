name: Sync Upstream

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    name: Sync with upstream vibesdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for proper comparison

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/cloudflare/vibesdk.git || true
          git remote set-url upstream https://github.com/cloudflare/vibesdk.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Check for updates
        id: check
        run: |
          # Get the latest commit from upstream
          UPSTREAM_COMMIT=$(git rev-parse upstream/main)

          # Check if we already have this commit
          if git merge-base --is-ancestor $UPSTREAM_COMMIT HEAD; then
            echo "No new upstream changes"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "New upstream changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "upstream_commit=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          fi

      - name: Create sync branch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="sync-upstream-${TIMESTAMP}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          git checkout -b $BRANCH_NAME

      - name: Attempt merge
        if: steps.check.outputs.has_changes == 'true'
        id: merge
        continue-on-error: true
        run: |
          # Try to merge upstream/main
          if git merge upstream/main --no-edit; then
            echo "merge_status=success" >> $GITHUB_OUTPUT
          else
            echo "merge_status=conflict" >> $GITHUB_OUTPUT
            # Abort the conflicted merge
            git merge --abort
            # Instead, create commits for files that can be merged
            git checkout upstream/main -- .
            git add .
            git commit -m "sync: merge upstream changes" || true
          fi

      - name: Push sync branch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git push origin $BRANCH_NAME

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MERGE_STATUS="${{ steps.merge.outputs.merge_status }}"

          if [ "$MERGE_STATUS" = "success" ]; then
            PR_TITLE="sync: merge upstream vibesdk changes"
            PR_BODY="## Upstream Sync

This PR automatically syncs changes from [cloudflare/vibesdk](https://github.com/cloudflare/vibesdk).

**Status**: ✅ Clean merge - no conflicts detected

**Upstream commit**: \`${{ steps.check.outputs.upstream_commit }}\`

### Review Checklist
- [ ] Verify branding changes are preserved (Dreamforge vs Orange)
- [ ] Check that custom deployment configurations remain intact
- [ ] Test build locally: \`bun run build\`
- [ ] Verify deployment works: check Cloudflare Pages logs

### Auto-generated
This PR was created by the upstream sync workflow."
          else
            PR_TITLE="sync: upstream vibesdk changes (may need manual review)"
            PR_BODY="## Upstream Sync

This PR syncs changes from [cloudflare/vibesdk](https://github.com/cloudflare/vibesdk).

**Status**: ⚠️ Merge conflicts detected - manual review required

**Upstream commit**: \`${{ steps.check.outputs.upstream_commit }}\`

### Manual Steps Required
1. Review the changes in this PR
2. Check for conflicts with Dreamforge branding
3. Verify custom configurations are preserved
4. Test build locally: \`bun run build\`
5. Update as needed before merging

### Auto-generated
This PR was created by the upstream sync workflow."
          fi

          gh pr create \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME" \
            --label "upstream-sync"

      - name: Summary
        if: steps.check.outputs.has_changes == 'true'
        run: |
          echo "✅ Created PR for upstream sync: $BRANCH_NAME"
          echo "Review the PR and merge when ready"
